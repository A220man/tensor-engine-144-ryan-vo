[workspace]
resolver = "2"
members = [
    "crates/openshell-ocsf",
    "crates/openshell-otel",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Ryan Vo <ryandtvo@gmail.com>"]
repository = "https://github.com/NVIDIA/OpenShell"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
thiserror = "1.0"
tracing = "0.1"
tracing-opentelemetry = "0.25"
opentelemetry = { version = "0.24", features = ["trace"] }
opentelemetry_sdk = { version = "0.24", features = ["trace"] }
once_cell = "1.19"
schemars = "0.8"
jsonschema = "0.16"